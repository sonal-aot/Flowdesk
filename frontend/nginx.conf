# Serve the console; send everything else to the backend.
#
# The API lives at the root -- /flows, /me, /tasks -- so routing by API prefix
# would need editing every time a route is added. This inverts it: the static
# surface is four fixed things, so anything that is not a file on disk is the
# API's. New routes need no change here.

upstream backend {
    server backend:8020;
}

server {
    listen 80;
    server_name _;

    # The bundle is content-hashed, the entry point is not.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @api;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @api;
    }

    location @api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A service task is an outbound HTTP call made inside the request, so a
        # slow one must not be cut off at nginx's 60s default.
        proxy_read_timeout 120s;
    }
}
