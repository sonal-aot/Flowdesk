[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "flowdesk"
version = "1.0.0"
description = "Flowdesk - a workflow console built on m8flow-bpmn-core."
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi>=0.115,<1.0",
  "m8flow-bpmn-core",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32,<1.0",
]

[project.scripts]
flowdesk = "flowdesk.main:run"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowdesk"]

[tool.uv.sources]
m8flow-bpmn-core = { path = "vendor/m8flow_bpmn_core-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
