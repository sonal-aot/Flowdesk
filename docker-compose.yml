# docker compose up --build
#
# Then open http://localhost:8080 and sign in as admin / admin.
#
# Two containers on two ports: the API and engine on 8081, the console on 8080.
# Neither is 5173 or 8020, so a container stack and `npm run dev` / `uv run
# flowdesk` can be up at the same time without fighting over a port.
#
# The console's nginx also proxies the API, so the browser only ever talks to
# 8080 and there is no CORS to configure. 8081 is for curl, another client, or
# looking at the API on its own.
services:
  backend:
    build: .
    ports:
      - "8081:8020"
    volumes:
      # The database outlives the container. Delete the volume to start over:
      #   docker compose down -v
      - flowdesk-data:/data
    environment:
      # The browser reaches the API through the console's nginx, same origin, so
      # nothing cross-origin has to be allowed. Anything talking straight to
      # 8081 from a browser page would need its origin listed here.
      FLOWDESK_CORS_ORIGINS: ""
      # Change this. Session tokens are signed with it, so the default lets
      # anyone who knows it mint a session.
      FLOWDESK_SECRET_KEY: "change-me-before-anyone-else-can-reach-this"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flowdesk-data:
